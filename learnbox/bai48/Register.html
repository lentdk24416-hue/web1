<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Electronics - Registration Form</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: white;
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }

        .container {
            width: 540px;
            max-width: 100%;
            margin: auto;
            padding: 10px 0;
            background-color: #99ccff;
            border: 2px solid #1555ee;
        }

        .logo {
            display: block;
            width: 240px;
            height: auto;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            font-size: 22px;
            margin: 20px 0;
        }

        .description {
            text-align: center;
            margin-bottom: 4px;
        }

        form {
            width: 420px;
            max-width: 96%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 2px 0;
            vertical-align: top;
        }

        .label {
            width: 145px;
            white-space: nowrap;
        }

        input[type="text"],
        select,
        textarea {
            box-sizing: border-box;
            border: 1px solid #aaaaaa;
            background-color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        input[type="text"] {
            height: 20px;
            padding: 1px 3px;
        }

        .name-line,
        .city-line {
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .name-input {
            width: 90px;
        }

        .address-input {
            width: 162px;
        }

        .medium-input {
            width: 114px;
        }

        .state-input {
            width: 32px;
        }

        .zip-input {
            width: 56px;
        }

        select {
            width: 95px;
            height: 20px;
        }

        hr {
            border: 0;
            border-top: 1px solid #888888;
            margin: 10px 0;
        }

        .options {
            display: grid;
            grid-template-columns: 106px 1fr;
            row-gap: 2px;
        }

        .options label {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 0 3px 0 0;
        }

        textarea {
            width: 100%;
            height: 82px;
            padding: 4px;
            resize: vertical;
        }

        .buttons {
            text-align: center;
            margin-top: 4px;
        }

        button {
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="logo" src="Jackson.gif" alt="Jackson Electronics">

        <h2>Registration Form</h2>

        <p class="description">
            Register your Jackson Electronics product here
        </p>

        <form id="registerForm">
            <table>
                <tr>
                    <td class="label">
                        <label for="firstName">First Name:</label>
                    </td>
                    <td>
                        <div class="name-line">
                            <input class="name-input" type="text"
                                   id="firstName" name="firstName">

                            <label for="lastName">Last Name:</label>

                            <input class="name-input" type="text"
                                   id="lastName" name="lastName">
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="address1">Address #1:</label>
                    </td>
                    <td>
                        <input class="address-input" type="text"
                               id="address1" name="address1">
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="address2">Address #2:</label>
                    </td>
                    <td>
                        <input class="address-input" type="text"
                               id="address2" name="address2">
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="city">City:</label>
                    </td>
                    <td>
                        <div class="city-line">
                            <input class="medium-input" type="text"
                                   id="city" name="city">

                            <label for="state">State:</label>
                            <input class="state-input" type="text"
                                   id="state" name="state">

                            <label for="zip">Zip:</label>
                            <input class="zip-input" type="text"
                                   id="zip" name="zip">
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="country">Country:</label>
                    </td>
                    <td>
                        <input class="medium-input" type="text"
                               id="country" name="country"
                               value="United States">
                    </td>
                </tr>
            </table>

            <hr>

            <table>
                <tr>
                    <td class="label">
                        <label for="product">Product:</label>
                    </td>
                    <td>
                        <select id="product" name="product">
                            <option value="" hidden></option>
                            <option value="ScanMaster" selected>ScanMaster</option>
                            <option value="Printer">Printer</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Keyboard">Keyboard</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="datePurchased">Date Purchased:</label>
                    </td>
                    <td>
                        <input class="medium-input" type="text"
                               id="datePurchased" name="datePurchased">
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="serial">Serial #:</label>
                    </td>
                    <td>
                        <input class="medium-input" type="text"
                               id="serial" name="serial">
                    </td>
                </tr>

                <tr>
                    <td class="label">Used for:</td>
                    <td>
                        <div class="options">
                            <label>
                                <input type="radio" name="usedFor" value="Home">
                                Home
                            </label>

                            <label>
                                <input type="radio" name="usedFor"
                                       value="Educational Institution">
                                Educational Institution
                            </label>

                            <label>
                                <input type="radio" name="usedFor"
                                       value="Business" checked>
                                Business
                            </label>

                            <label>
                                <input type="radio" name="usedFor" value="Other">
                                Other
                            </label>

                            <label>
                                <input type="radio" name="usedFor"
                                       value="Government">
                                Government
                            </label>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="label">System (check all that apply):</td>
                    <td>
                        <div class="options">
                            <label>
                                <input type="checkbox" name="system"
                                       value="Windows">
                                Windows
                            </label>

                            <label>
                                <input type="checkbox" name="system"
                                       value="UNIX">
                                UNIX
                            </label>

                            <label>
                                <input type="checkbox" name="system"
                                       value="Macintosh">
                                Macintosh
                            </label>

                            <label>
                                <input type="checkbox" name="system"
                                       value="Other">
                                Other
                            </label>
                        </div>
                    </td>
                </tr>
            </table>

            <hr>

            <table>
                <tr>
                    <td class="label">
                        <label for="comments">Comments?:</label>
                    </td>
                    <td>
                        <textarea id="comments" name="comments"></textarea>
                    </td>
                </tr>
            </table>

            <div class="buttons">
                <button type="submit">Click to register</button>
                <button type="button" onclick="clearForm()">
                    Click to cancel
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById("registerForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            alert("Đăng ký thành công!");
        });

        function clearForm() {
            form.querySelectorAll('input[type="text"], textarea').forEach(
                function (field) {
                    field.value = "";
                }
            );

            form.querySelectorAll(
                'input[type="radio"], input[type="checkbox"]'
            ).forEach(function (field) {
                field.checked = false;
            });

            document.getElementById("product").value = "";
            document.getElementById("firstName").focus();
        }
    </script>
</body>
</html>
