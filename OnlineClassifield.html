<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Classifieds Search Form</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 15px;
            background-color: white;
        }

        .search-box {
            width: 536px;
            max-width: calc(100% - 36px);
            margin: 30px auto;
            padding: 0 8px 40px;
            background-color: #ccffff;
            border: 1px solid #aaaaaa;
            border-left: 2px solid blue;
            border-right: 2px solid blue;
        }

        h2 {
            margin: 18px 0;
            color: red;
            font-size: 24px;
            letter-spacing: 1px;
        }

        hr {
            border: none;
            border-top: 2px groove #dddddd;
        }

        .question {
            margin: 18px 0;
            font-weight: bold;
        }

        .options {
            margin-left: 6px;
        }

        .sections {
            display: grid;
            grid-template-columns: max-content max-content;
            column-gap: 8px;
            row-gap: 2px;
        }

        .publications {
            display: grid;
            grid-template-columns: max-content max-content max-content;
            column-gap: 8px;
            row-gap: 2px;
        }

        .options label {
            white-space: nowrap;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 0 3px 0 0;
            vertical-align: middle;
        }

        input[type="text"] {
            box-sizing: border-box;
            height: 22px;
            padding: 2px 4px;
            border: 1px solid #99aabb;
            background-color: white;
        }

        .date-row {
            margin-top: 24px;
        }

        .date-input {
            width: 138px;
        }

        #keywords {
            width: 90%;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 22px 0 0 6px;
        }

        .image-button {
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .image-button img {
            display: block;
        }

        @media (max-width: 560px) {
            .publications {
                grid-template-columns: max-content;
            }

            .date-input {
                width: 110px;
            }
        }
    </style>
</head>

<body>
    <main class="search-box">
        <h2>Online Classifieds Search Form</h2>
        <hr>

        <form id="searchForm">
            <p class="question">
                1) Search for a classified in the following sections:
            </p>

            <div class="options sections">
                <label>
                    <input type="radio" name="section" value="Employment">
                    Employment
                </label>

                <label>
                    <input type="radio" name="section" value="Personal">
                    Personal
                </label>

                <label>
                    <input type="radio" name="section" value="For Sale" checked>
                    For Sale
                </label>

                <label>
                    <input type="radio" name="section" value="Miscellaneous">
                    Miscellaneous
                </label>

                <label>
                    <input type="radio" name="section" value="Housing">
                    Housing
                </label>

                <label>
                    <input type="radio" name="section" value="All of the above">
                    All of the above
                </label>
            </div>

            <p class="question">
                2) Search the following publications:
            </p>

            <div class="options publications">
                <label>
                    <input type="checkbox" name="publication"
                           value="Midwest times" checked>
                    Midwest times
                </label>

                <label>
                    <input type="checkbox" name="publication"
                           value="Modern News">
                    Modern News
                </label>

                <label>
                    <input type="checkbox" name="publication"
                           value="Employment Today">
                    Employment Today
                </label>

                <label>
                    <input type="checkbox" name="publication"
                           value="Great Lakes Classifieds" checked>
                    Great Lakes Classifieds
                </label>

                <label>
                    <input type="checkbox" name="publication"
                           value="Middleton Daily">
                    Middleton Daily
                </label>

                <label>
                    <input type="checkbox" name="publication"
                           value="Cashtown Daily News">
                    Cashtown Daily News
                </label>
            </div>

            <div class="date-row">
                <label for="fromDate">
                    <strong>3) From to</strong>
                </label>

                <input type="text"
                       id="fromDate"
                       name="fromDate"
                       class="date-input"
                       placeholder="mm/dd/yy">

                <label for="toDate">to</label>

                <input type="text"
                       id="toDate"
                       name="toDate"
                       class="date-input"
                       placeholder="mm/dd/yy">.
            </div>

            <p class="question">
                <label for="keywords">
                    4) Enter a few keywords to describe the classified.
                </label>
            </p>

            <input type="text" id="keywords" name="keywords">

            <p class="question">
                5) Click one of the options below:
            </p>

            <div class="buttons">
                <button type="submit"
                        class="image-button"
                        title="Search">
                    <img src="./Search.gif" alt="Search">
                </button>

                <button type="button"
                        class="image-button"
                        onclick="showHelp()"
                        title="Help">
                    <img src="./Help.gif" alt="Help">
                </button>

                <button type="button"
                        class="image-button"
                        onclick="clearForm()"
                        title="Cancel">
                    <img src="./Cancel.gif" alt="Cancel">
                </button>
            </div>
        </form>
    </main>

    <script>
        const form = document.getElementById("searchForm");

        // Giả lập tìm kiếm
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const selectedSection = form.querySelector(
                'input[name="section"]:checked'
            );

            const selectedPublications = Array.from(
                form.querySelectorAll('input[name="publication"]:checked')
            ).map(function (item) {
                return item.value;
            });

            const fromDate = document.getElementById("fromDate").value.trim();
            const toDate = document.getElementById("toDate").value.trim();
            const keywords = document.getElementById("keywords").value.trim();

            alert(
                "THÔNG TIN TÌM KIẾM GIẢ LẬP\n\n" +
                "Chuyên mục: " +
                (selectedSection ? selectedSection.value : "Chưa chọn") +
                "\n\nTờ báo: " +
                (selectedPublications.length
                    ? selectedPublications.join(", ")
                    : "Chưa chọn") +
                "\n\nTừ ngày: " + (fromDate || "Chưa nhập") +
                "\nĐến ngày: " + (toDate || "Chưa nhập") +
                "\n\nTừ khóa: " + (keywords || "Chưa nhập")
            );
        });

        // Xóa toàn bộ dữ liệu và lựa chọn trên form
        function clearForm() {
            form.querySelectorAll("input").forEach(function (input) {
                if (input.type === "radio" || input.type === "checkbox") {
                    input.checked = false;
                } else {
                    input.value = "";
                }
            });
        }

        // Mở trang hướng dẫn trong tab mới
        function showHelp() {
            const helpWindow = window.open("", "_blank");

            if (!helpWindow) {
                alert("Bạn hãy cho phép cửa sổ bật lên để mở trang hướng dẫn.");
                return;
            }

            helpWindow.document.write(`
                <!DOCTYPE html>
                <html lang="vi">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport"
                          content="width=device-width, initial-scale=1.0">
                    <title>Hướng dẫn sử dụng</title>

                    <style>
                        body {
                            max-width: 700px;
                            margin: 40px auto;
                            padding: 20px;
                            background-color: #ccffff;
                            font-family: Arial, sans-serif;
                            line-height: 1.7;
                        }

                        h1 {
                            color: red;
                        }
                    </style>
                </head>

                <body>
                    <h1>Hướng dẫn tìm kiếm</h1>

                    <ol>
                        <li>
                            Chọn một chuyên mục trong phần
                            <strong>Search for a classified</strong>.
                        </li>

                        <li>
                            Chọn một hoặc nhiều tờ báo trong phần
                            <strong>Search the following publications</strong>.
                        </li>

                        <li>
                            Nhập ngày bắt đầu và ngày kết thúc theo
                            định dạng <strong>mm/dd/yy</strong>
                            (tháng/ngày/năm).
                        </li>

                        <li>
                            Nhập từ khóa mô tả nội dung bạn muốn tìm kiếm.
                        </li>

                        <li>
                            Nhấn <strong>Search</strong> để hiển thị
                            thông tin tìm kiếm giả lập.
                        </li>

                        <li>
                            Nhấn <strong>Cancel</strong> để xóa toàn bộ
                            dữ liệu và các lựa chọn trên form.
                        </li>
                    </ol>

                    <p>
                        Ví dụ: Chọn chuyên mục <strong>For Sale</strong>
                        và nhập từ khóa <strong>laptop</strong>.
                    </p>
                </body>
                </html>
            `);

            helpWindow.document.close();
        }
    </script>
</body>
</html>
